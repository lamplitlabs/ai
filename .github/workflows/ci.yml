name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: the site - tests, types, build, every route headless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/ui/package-lock.json
      - run: npm ci
        working-directory: js/ui
      - run: make lint
      - run: make test
      - run: make ui-check
        env:
          BROWSER_PATH: /usr/bin/google-chrome
